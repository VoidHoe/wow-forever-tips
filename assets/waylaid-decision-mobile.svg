<svg xmlns="http://www.w3.org/2000/svg" width="360" height="414" viewBox="0 0 360 414">
  <title>Que faire d'une caisse Waylaid</title>
  <desc>Lis les matériaux demandés et compare leur coût à la récompense. Si remplir la caisse est intéressant, complète-la et rapporte-la. Sinon, garde-la ou vends-la.</desc>
  <rect width="360" height="414" rx="14" fill="#101923"/>
  <rect x="1" y="1" width="358" height="412" rx="13" fill="none" stroke="#52607b" stroke-width="2"/>
  <g font-family="system-ui,sans-serif">
    <text x="18" y="28" fill="#c6ff72" font-size="12" font-weight="800" letter-spacing="1">CAISSE WAYLAID</text>
    <rect x="16" y="43" width="328" height="58" rx="10" fill="#1c2739" stroke="#52607b"/>
    <text x="30" y="78" fill="#c6ff72" font-size="13" font-weight="800">01</text>
    <text x="65" y="78" fill="#f7f8fc" font-size="16" font-weight="750">Trouve une caisse</text>
    <text x="171" y="120" fill="#c6ff72" font-size="21" font-weight="800">↓</text>
    <rect x="16" y="133" width="328" height="58" rx="10" fill="#1c2739" stroke="#52607b"/>
    <text x="30" y="168" fill="#c6ff72" font-size="13" font-weight="800">02</text>
    <text x="65" y="168" fill="#f7f8fc" font-size="16" font-weight="750">Lis les matériaux</text>
    <text x="171" y="210" fill="#c6ff72" font-size="21" font-weight="800">↓</text>
    <rect x="16" y="223" width="328" height="58" rx="10" fill="#1c2739" stroke="#52607b"/>
    <text x="30" y="258" fill="#c6ff72" font-size="13" font-weight="800">03</text>
    <text x="65" y="258" fill="#f7f8fc" font-size="16" font-weight="750">Compare le coût</text>
    <rect x="16" y="297" width="328" height="48" rx="9" fill="#243529" stroke="#506a5c"/>
    <text x="30" y="317" fill="#c6ff72" font-size="11" font-weight="800">SI ÇA VAUT LE COUP</text>
    <text x="30" y="335" fill="#f7f8fc" font-size="13" font-weight="650">Complète et rapporte la caisse</text>
    <rect x="16" y="353" width="328" height="48" rx="9" fill="#2b2536" stroke="#61568f"/>
    <text x="30" y="373" fill="#c9c1ff" font-size="11" font-weight="800">SI C'EST TROP CHER</text>
    <text x="30" y="391" fill="#f7f8fc" font-size="13" font-weight="650">Garde-la ou vends-la</text>
  </g>
</svg>
